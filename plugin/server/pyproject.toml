[project]
name = "freecad-bridge"
version = "1.2.0"
description = "MCP server and installer that connect Claude Code to a running FreeCAD"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
freecad-bridge-mcp = "freecad_bridge.mcp_server:main"
freecad-bridge = "freecad_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freecad_bridge"]

[tool.uv]
# uvx --from <this dir> rebuilds only when a cache key changes; include the sources so code edits
# take effect without a version bump (by default only pyproject.toml counts).
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
